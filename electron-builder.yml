appId: com.giao1907.lux
productName: Lux
directories:
  output: release
  buildResources: assets
files:
  - out/**
  - package.json
extraResources:
  - from: data
    to: data-seed
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "Lux-Setup-${version}.exe"
